<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#07070A" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Coursework" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Coursework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070A;
    --card:rgba(28,28,30,.72);
    --hairline:rgba(255,255,255,.08);
    --text:#F5F5F7;
    --text-2:#98989F;
    --text-3:#636368;
    --blue:#0A84FF;
    --green:#30D158;
    --orange:#FF9F0A;
    --red:#FF453A;
    --r-lg:22px;
    --r-md:16px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
    letter-spacing:-.01em;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:-20% -10% auto -10%;height:75vh;z-index:-1;
    background:
      radial-gradient(46% 55% at 18% 12%, rgba(10,132,255,.30), transparent 70%),
      radial-gradient(40% 50% at 82% 4%, rgba(191,90,242,.26), transparent 72%),
      radial-gradient(50% 45% at 55% 40%, rgba(255,55,95,.14), transparent 75%);
    filter:blur(20px);pointer-events:none;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,rgba(7,7,10,0) 0%,rgba(7,7,10,.65) 42%,var(--bg) 68%);
  }
  .wrap{max-width:820px;margin:0 auto;padding:34px 20px 120px}

  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--text-3);text-transform:uppercase}
  h1{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:2px 0 22px}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .settings-btn{
    flex:none;position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--hairline);
    background:var(--card);backdrop-filter:blur(20px);color:var(--text-2);cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin-top:2px;transition:.18s;
  }
  .settings-btn:hover{color:var(--text);background:rgba(44,44,46,.8)}
  .sync-badge{
    position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;
    background:var(--text-3);border:2px solid var(--bg);
  }
  .sync-badge.synced{background:var(--green)}
  .sync-badge.syncing{background:var(--orange);animation:pulse 1s ease-in-out infinite}
  .sync-badge.error{background:var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .sync-row{display:flex;align-items:center;gap:10px;padding:11px 0}
  .sync-row + .sync-row{border-top:1px solid rgba(255,255,255,.05)}
  .sync-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .code-display{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;font-weight:700;
    letter-spacing:.08em;background:rgba(120,120,128,.16);border-radius:12px;
    padding:14px;text-align:center;margin:10px 0;user-select:all;
  }
  .steps{font-size:13.5px;color:var(--text-2);line-height:1.6}
  .steps b{color:var(--text);font-weight:600}
  .steps a{color:var(--blue)}

  /* composer */
  .composer{
    background:var(--card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
    border:1px solid var(--hairline);border-radius:var(--r-lg);
    padding:6px 6px 6px 18px;display:flex;align-items:center;gap:10px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);transition:border-color .2s ease;
  }
  .composer:focus-within{border-color:rgba(10,132,255,.55)}
  .composer input{
    flex:1;background:none;border:0;outline:0;color:var(--text);
    font-family:var(--font);font-size:16px;padding:12px 0;letter-spacing:-.01em;min-width:0;
  }
  .composer input::placeholder{color:var(--text-3)}
  .add-btn{
    border:0;border-radius:14px;background:var(--blue);color:#fff;font-family:var(--font);
    font-size:15px;font-weight:600;padding:11px 18px;cursor:pointer;
    transition:transform .12s ease,opacity .2s ease;flex:none;
  }
  .add-btn:hover{transform:scale(1.03)}
  .add-btn:active{transform:scale(.97)}
  .add-btn:disabled{opacity:.35;cursor:default;transform:none}
  .preview{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 4px 0;min-height:20px;font-size:13px;color:var(--text-3)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(120,120,128,.20);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:500;color:var(--text-2)}
  .chip b{font-weight:600;color:var(--text)}
  .chip.warn{background:rgba(255,159,10,.16);color:var(--orange)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}

  /* tabs */
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:22px 4px 6px;scrollbar-width:none;-ms-overflow-style:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:none;display:inline-flex;align-items:center;gap:7px;background:rgba(120,120,128,.16);
    border:1px solid transparent;color:var(--text-2);border-radius:999px;padding:8px 15px;
    font-family:var(--font);font-size:14px;font-weight:600;letter-spacing:-.01em;
    cursor:pointer;white-space:nowrap;transition:background .18s,color .18s;
  }
  .tab:hover{color:var(--text)}
  .tab.on{color:#fff}
  .tab.ghost{color:var(--text-3);font-weight:500}
  .tab .n{font-variant-numeric:tabular-nums;opacity:.7}

  /* cards */
  .card{
    background:var(--card);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
    border:1px solid var(--hairline);border-radius:var(--r-lg);padding:20px;margin-top:14px;
  }
  .card-title{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
    color:var(--text-3);margin-bottom:16px;
  }
  .card-title .r{display:flex;gap:4px;align-items:center}

  /* summary */
  .summary{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .ring-wrap{position:relative;width:132px;height:132px;flex:none}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .ring-center .big{font-size:26px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .ring-center .sub{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
  .stats{display:flex;gap:12px;flex:1;min-width:240px}
  .stat{flex:1;background:rgba(120,120,128,.14);border-radius:var(--r-md);padding:13px 14px;min-width:0}
  .stat .n{font-size:27px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat .l{font-size:12px;font-weight:600;color:var(--text-3);margin-top:2px}

  /* week chart */
  .week{display:flex;gap:6px;align-items:flex-end;height:96px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end;height:100%}
  .bars{width:100%;display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-end;align-items:center;flex:1}
  .bar{width:74%;max-width:26px;border-radius:4px;min-height:4px}
  .day .lbl{font-size:11px;font-weight:600;color:var(--text-3)}
  .day.now .lbl{color:var(--blue)}
  .day .empty-tick{width:74%;max-width:26px;height:3px;border-radius:2px;background:rgba(120,120,128,.22)}

  /* schedule */
  .sched{display:flex;align-items:center;gap:12px;padding:9px 0}
  .sched + .sched{border-top:1px solid rgba(255,255,255,.05)}
  .sched .tm{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-2);width:78px;flex:none}
  .sched .nm{font-size:14.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sched .rm{font-size:12.5px;color:var(--text-3);white-space:nowrap}
  .sched.past{opacity:.4}

  /* class breakdown */
  .brk{display:flex;align-items:center;gap:12px;padding:9px 0}
  .brk + .brk{border-top:1px solid rgba(255,255,255,.05)}
  .brk .nm{font-size:14.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brk .ct{font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .track{width:110px;height:6px;border-radius:3px;background:rgba(120,120,128,.24);overflow:hidden;flex:none}
  .track i{display:block;height:100%;border-radius:3px}

  /* course header */
  .course-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .course-head .who{flex:1;min-width:200px}
  .course-code{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .course-name{font-size:22px;font-weight:700;letter-spacing:-.025em;margin:1px 0 4px}
  .course-meta{font-size:13.5px;color:var(--text-2)}
  .daypills{display:flex;gap:5px;margin-top:9px}
  .dp{
    width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;background:rgba(120,120,128,.16);color:var(--text-3);
  }

  /* syllabus */
  .syl-file{
    display:flex;align-items:center;gap:12px;background:rgba(120,120,128,.14);
    border-radius:var(--r-md);padding:12px 14px;
  }
  .syl-file .fi{flex:1;min-width:0}
  .syl-file .fn{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .syl-file .fs{font-size:12.5px;color:var(--text-3)}
  .drop{
    border:1.5px dashed rgba(255,255,255,.16);border-radius:var(--r-md);
    padding:22px 16px;text-align:center;cursor:pointer;transition:.18s;
  }
  .drop:hover,.drop.over{border-color:var(--blue);background:rgba(10,132,255,.07)}
  .drop .h{font-size:14.5px;font-weight:600}
  .drop .p{font-size:12.5px;color:var(--text-3);margin-top:2px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .row-2{display:flex;gap:8px;flex-wrap:wrap}
  textarea.field{resize:vertical;min-height:82px;width:100%;line-height:1.5;font-size:14px}

  /* list */
  .group-h{font-size:13px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text-3);margin:26px 4px 8px}
  .group-h.alert{color:var(--red)}
  .row{
    display:flex;align-items:flex-start;gap:13px;padding:13px 16px;background:var(--card);
    backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
    border:1px solid var(--hairline);border-radius:var(--r-md);margin-bottom:8px;
    transition:background .18s ease,opacity .2s ease;
  }
  .row:hover{background:rgba(44,44,46,.72)}
  .row.done{opacity:.45}
  .tick{
    flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid var(--text-3);
    background:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:.18s;
  }
  .tick:hover{border-color:var(--text-2)}
  .tick svg{opacity:0;transition:opacity .15s}
  .row.done .tick svg{opacity:1}
  .row .body{flex:1;min-width:0}
  .row .t{font-size:15.5px;font-weight:600;letter-spacing:-.015em;word-break:break-word}
  .row.done .t{text-decoration:line-through}
  .row .m{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:3px;font-size:13px;color:var(--text-2)}
  .row .m .cls{font-weight:600}
  .row .m .sep{color:var(--text-3)}
  .row .m .when.late{color:var(--red);font-weight:600}
  .row .m .when.soon{color:var(--orange);font-weight:600}
  .icon-btn{flex:none;background:none;border:0;color:var(--text-3);cursor:pointer;padding:4px;border-radius:8px;line-height:0;opacity:0;transition:.18s}
  .row:hover .icon-btn,.row:focus-within .icon-btn{opacity:1}
  .icon-btn:hover{color:var(--text);background:rgba(120,120,128,.2)}

  /* fields + buttons */
  .fields{display:flex;gap:8px;flex-wrap:wrap}
  .field{
    background:rgba(120,120,128,.16);border:1px solid var(--hairline);border-radius:12px;
    color:var(--text);font-family:var(--font);font-size:14px;padding:9px 12px;outline:0;
  }
  .field:focus{border-color:rgba(10,132,255,.6)}
  .field.grow{flex:1;min-width:180px}
  select.field{cursor:pointer}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .btn{
    border:0;border-radius:11px;padding:8px 15px;cursor:pointer;font-family:var(--font);
    font-size:14px;font-weight:600;background:rgba(120,120,128,.22);color:var(--text);
  }
  .btn:hover{background:rgba(120,120,128,.34)}
  .btn.pri{background:var(--blue);color:#fff}
  .btn.pri:disabled{opacity:.4;cursor:default}
  .btn.danger{background:rgba(255,69,58,.16);color:var(--red)}
  .btn.sm{padding:6px 12px;font-size:13px}

  .empty{text-align:center;padding:52px 20px;color:var(--text-3)}
  .empty .h{font-size:17px;font-weight:600;color:var(--text-2);margin-bottom:5px}
  .empty .p{font-size:14px;max-width:360px;margin:0 auto}

  .footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:34px;padding:0 4px;font-size:12.5px;color:var(--text-3);flex-wrap:wrap}
  .link{background:none;border:0;color:var(--text-3);font-family:var(--font);font-size:12.5px;cursor:pointer;padding:4px 6px;border-radius:8px}
  .link:hover{color:var(--text-2);background:rgba(120,120,128,.14)}

  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40;overflow:auto}
  .sheet{width:100%;max-width:400px;background:#1C1C1E;border:1px solid var(--hairline);border-radius:var(--r-lg);padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);margin:auto}
  .sheet.wide{max-width:640px}
  .sheet h2{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.02em}
  .sheet p.lede{margin:0 0 16px;font-size:13.5px;color:var(--text-2)}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .sw.on{border-color:#fff}
  .dump-list{max-height:44vh;overflow:auto;margin:14px 0 4px;border-top:1px solid var(--hairline)}
  .dl{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
  .dl.off{opacity:.35}
  .dl input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--blue);flex:none}
  .dl .b{flex:1;min-width:0}
  .dl .t{font-size:14.5px;font-weight:600;word-break:break-word}
  .dl .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:rgba(44,44,46,.92);backdrop-filter:blur(20px);border:1px solid var(--hairline);
    border-radius:14px;padding:11px 18px;font-size:14px;font-weight:500;
    opacity:0;pointer-events:none;transition:.25s ease;z-index:60;max-width:80vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  @media (max-width:560px){
    h1{font-size:28px}
    .wrap{padding:26px 15px 100px}
    .summary{gap:18px}
    .stats{flex-basis:100%}
    .ring-wrap{width:112px;height:112px}
    .track{width:70px}
    .sched .tm{width:70px;font-size:12.5px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head-row">
    <div>
      <div class="eyebrow" id="today-label"></div>
      <h1 id="greeting">Coursework</h1>
    </div>
    <button class="settings-btn" id="settings-btn" aria-label="Sync settings">
      <span class="sync-badge" id="sync-badge" title="Not synced"></span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" stroke="currentColor" stroke-width="1.4"/><path d="M16.4 11.2c.05-.4.08-.8.08-1.2s-.03-.8-.08-1.2l1.6-1.2-1.5-2.6-1.9.6a5.9 5.9 0 0 0-2-1.2L12 2h-3l-.6 2.4a5.9 5.9 0 0 0-2 1.2l-1.9-.6-1.5 2.6 1.6 1.2c-.05.4-.08.8-.08 1.2s.03.8.08 1.2l-1.6 1.2 1.5 2.6 1.9-.6c.6.5 1.27.93 2 1.2L9 18h3l.6-2.4a5.9 5.9 0 0 0 2-1.2l1.9.6 1.5-2.6-1.6-1.2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="composer" id="composer">
    <input id="quick-add" autocomplete="off" spellcheck="false"
           placeholder="Problem set 4 for Circuits due Friday 11:59pm" />
    <button class="add-btn" id="add-btn" disabled>Add</button>
  </div>
  <div class="preview" id="preview"></div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>

  <div class="footer">
    <span id="count-note"></span>
    <span id="footer-course-actions">
      <button class="link" id="import">Import syllabus</button>
      <button class="link" id="toggle-done">Show completed</button>
    </span>
    <span id="footer-intern-actions" style="display:none">
      <button class="link" id="toggle-closed">Show closed</button>
    </span>
    <span>
      <button class="link" id="wipe">Clear all</button>
    </span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   Coursework — assignment tracker
   Everything stays in this browser: settings and assignments in localStorage,
   syllabus files in IndexedDB. Nothing is uploaded anywhere.
   ========================================================================== */

const KEY = "coursework.v2";
const PALETTE = ["#0A84FF","#64D2FF","#FF9F0A","#FFD60A","#30D158","#BF5AF2","#5E5CE6","#FF375F","#FF453A","#AC8E68"];
const DAY = 86400000;
const DAYCODE = {M:1,T:2,W:3,R:4,F:5};

/* Fall roster, seeded from Current_Classes.xlsx */
const SEED = [
  {code:"ENGR 2320", name:"Electric Circuits", shortLabel:"Circuits", instructor:"Farzan Aminian", color:"#0A84FF",
   alias:["circuits","electric circuits"],
   meets:[{days:[1,3,5], start:"11:30", end:"12:20", room:"CSI 553"}]},
  {code:"ENGR 2120", name:"Electric Circuits Laboratory", shortLabel:"Circuits Lab", instructor:"Joshua Schwartz", color:"#64D2FF",
   alias:["circuits lab","circuit lab","e lab"],
   meets:[{days:[4], start:"14:10", end:"16:50", room:"CSI 553"}]},
  {code:"ENGR 2314", name:"Mechanics 2", shortLabel:"Mechanics 2", instructor:"Jack Leifer", color:"#FF9F0A",
   alias:["mechanics ii","mechanics 2","mech ii","dynamics"],
   meets:[{days:[2,4], start:"09:55", end:"11:10", room:"CSI 448"}]},
  {code:"ENGR 3339", name:"Mechanics of Materials", shortLabel:"Mech of Materials", instructor:"Jack Leifer", color:"#FFD60A",
   alias:["mechanics of materials","mom","solids"],
   meets:[{days:[2,4], start:"19:00", end:"20:15", room:"CSI 553"}]},
  {code:"ENGR 2181", name:"Engineering Design 3", shortLabel:"Design 3", instructor:"Eli Iglesias", color:"#30D158",
   alias:["design iii","design 3","engineering design","design"],
   meets:[{days:[3], start:"13:30", end:"16:20", room:"CSI 258 / 282"}]},
  {code:"CHEM 1311", name:"General Chemistry I", shortLabel:"Chemistry", instructor:"Calvin Jon Leonen", color:"#BF5AF2",
   alias:["chem","chemistry","gen chem"],
   meets:[{days:[2,4], start:"11:20", end:"12:35", room:"Marrs McLean 170"}]},
  {code:"CHEM 1111", name:"General Chemistry Lab for Engineers", shortLabel:"Chem Lab", instructor:"Nicholas Vitti", color:"#5E5CE6",

   meets:[{days:[1], start:"13:30", end:"16:30", room:"CSI 240"}]},

/* ---------------- storage ---------------- */
/* ==========================================================================
   Sync layer
   Local-first: every read/write hits localStorage instantly, so the app
   never blocks on the network. If a Supabase project + sync code are
   configured, changes also push to the cloud, and other devices using the
   same code pull them down. No account system — the "sync code" you set
   in Settings is the whole identity, like a shared secret between your
   own devices.
   ========================================================================== */
const CFG_KEY = "coursework.cloud.v1";
let cloud = null;   // {url, anonKey, code} once configured
let cloudTimer = null;
let lastPulledAt = 0;

function loadCloudConfig(){
  try { const raw = localStorage.getItem(CFG_KEY); if (raw) cloud = JSON.parse(raw); } catch(e){}
}
function saveCloudConfig(c){
  cloud = c;
  try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch(e){}
}
function clearCloudConfig(){
  cloud = null;
  try { localStorage.removeItem(CFG_KEY); } catch(e){}
}

async function supaFetch(path, opts){
  const res = await fetch(cloud.url.replace(/\/$/,"") + "/rest/v1/" + path, {
    ...opts,
    headers: {
      "apikey": cloud.anonKey,
      "Authorization": "Bearer " + cloud.anonKey,
      "Content-Type": "application/json",
      ...(opts && opts.headers ? opts.headers : {})
    }
  });
  if (!res.ok) throw new Error("Supabase " + res.status + ": " + await res.text());
  return res.status === 204 ? null : res.json();
}

async function cloudPull(){
  if (!cloud) return null;
  const rows = await supaFetch("tracker_state?code=eq." + encodeURIComponent(cloud.code) + "&select=data,updated_at");
  if (rows && rows.length) return rows[0];
  return null;
}
async function cloudPush(data){
  if (!cloud) return;
  await supaFetch("tracker_state?code=eq." + encodeURIComponent(cloud.code), {
    method: "POST",
    headers: {"Prefer": "resolution=merge-duplicates"},
    body: JSON.stringify({code: cloud.code, data, updated_at: new Date().toISOString()})
  });
}

const Store = {
  async load(){
    let local = null;
    try { const raw = localStorage.getItem(KEY); if (raw) local = JSON.parse(raw); } catch(e){}
    if (window.storage){
      try { const r = await window.storage.get(KEY); if (r && r.value) local = JSON.parse(r.value); } catch(e){}
    }
    if (cloud){
      try {
        const remote = await cloudPull();
        if (remote && (!local || new Date(remote.updated_at) > new Date(local.__savedAt || 0))){
          lastPulledAt = Date.now();
          return remote.data;
        }
      } catch(e){ setSyncBadge("error"); }
    }
    return local;
  },
  async save(d){
    d.__savedAt = new Date().toISOString();
    const s = JSON.stringify(d);
    if (window.storage){ try { await window.storage.set(KEY, s); } catch(e){} }
    try { localStorage.setItem(KEY, s); } catch(e){ toast("Storage is full — remove a syllabus link or two."); }
    if (cloud){
      setSyncBadge("syncing");
      clearTimeout(cloudTimer);
      cloudTimer = setTimeout(async () => {
        try { await cloudPush(d); setSyncBadge("synced"); }
        catch(e){ setSyncBadge("error"); }
      }, 700);
    }
  }
};
const save = () => Store.save({classes:state.classes, items:state.items, internships:state.internships, showDone:state.showDone, showClosed:state.showClosed});

function setSyncBadge(mode){
  const b = $("sync-badge");
  if (!b) return;
  b.className = "sync-badge " + mode;
  b.title = mode === "synced" ? "Synced" : mode === "syncing" ? "Syncing…" : mode === "error" ? "Sync error — check Settings" : "Not synced";
}

/* Poll for remote changes every 20s while the tab is open, so a change made
   on your phone shows up on your laptop without a manual refresh. */
function startCloudPolling(){
  if (!cloud) return;
  setInterval(async () => {
    if (document.hidden) return;
    try {
      const remote = await cloudPull();
      if (remote && new Date(remote.updated_at).getTime() > lastPulledAt + 1000){
        lastPulledAt = Date.now();
        state.classes = remote.data.classes || [];
        state.items = remote.data.items || [];
        state.internships = remote.data.internships || [];
        try { localStorage.setItem(KEY, JSON.stringify(remote.data)); } catch(e){}
        render();
        setSyncBadge("synced");
      }
    } catch(e){ setSyncBadge("error"); }
  }, 20000);
}

/* syllabus files live in IndexedDB so big PDFs don't blow the quota */
const Files = {
  open(){
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error("no indexeddb"));
      const r = indexedDB.open("coursework-files", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("files");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction("files", mode);
      const out = fn(t.objectStore("files"));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error);
    });
  },
  put(key, blob){ return this.tx("readwrite", s => s.put(blob, key)); },
  get(key){ return this.tx("readonly", s => s.get(key)); },
  del(key){ return this.tx("readwrite", s => s.delete(key)); }
};

/* ---------------- dates ---------------- */
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const sameDay = (a,b) => startOfDay(a).getTime() === startOfDay(b).getTime();
const daysBetween = (a,b) => Math.round((startOfDay(b) - startOfDay(a)) / DAY);

function fmtDue(iso){
  const d = new Date(iso), diff = daysBetween(new Date(), d);
  const time = (d.getHours() === 23 && d.getMinutes() === 59) ? "" :
    " · " + d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  let label;
  if (diff === 0) label = "Today";
  else if (diff === 1) label = "Tomorrow";
  else if (diff === -1) label = "Yesterday";
  else if (diff > 1 && diff < 7) label = d.toLocaleDateString([], {weekday:"long"});
  else label = d.toLocaleDateString([], {month:"short", day:"numeric"});
  return label + time;
}
function lateness(iso){
  const d = new Date(iso);
  if (d < new Date()) return "late";
  return daysBetween(new Date(), d) <= 1 ? "soon" : "";
}
function fmtClock(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  return ((h % 12) || 12) + ":" + String(m).padStart(2,"0") + " " + ap;
}
const minutesOf = hhmm => { const [h,m] = hhmm.split(":").map(Number); return h*60 + m; };

/* ---------------- parsing ---------------- */
const WEEKDAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const WD_SHORT = ["sun","mon","tue","wed","thu","fri","sat"];
const MONTHS = ["january","february","march","april","may","june","july","august","september","october","november","december"];
const MON3 = MONTHS.map(m => m.slice(0,3)).join("|");
const esc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function nextWeekday(idx, forceNext){
  const now = new Date(), out = startOfDay(now);
  let delta = (idx - now.getDay() + 7) % 7;
  if (forceNext) delta = delta === 0 ? 7 : delta + 7;
  out.setDate(out.getDate() + delta);
  return out;
}

function parse(text, defaultClassId){
  let s = " " + String(text).replace(/[\t|]+/g, " ").trim() + " ";
  const res = {title:"", classId:defaultClassId || null, newClass:null, due:null};
  const cut = re => { const m = s.match(re); if (m){ s = s.replace(m[0], " "); return m; } return null; };

  /* strip list decoration: "-", "•", "3.", "Week 4:" */
  s = s.replace(/^\s*[-–—•*]+\s*/, " ")
       .replace(/^\s*\d{1,2}[.)]\s+/, " ")
       .replace(/^\s*week\s+\d{1,2}\s*[:–-]\s*/i, " ");

  /* explicit tag: #Circuits or #"Music History" */
  let m = s.match(/\s#("([^"]+)"|[A-Za-z0-9][\w&+-]*(?:\s\d{3,4})?)/);
  if (m){
    const name = (m[2] || m[1]).trim();
    const hit = matchClass(name);
    if (hit) res.classId = hit.id; else res.newClass = name;
    s = s.replace(m[0], " ");
  }

  /* time of day */
  let time = null, t;
  if ((t = cut(/\bat\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i)) || (t = cut(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i))){
    let h = parseInt(t[1],10) % 12;
    if (/pm/i.test(t[3])) h += 12;
    time = [h, t[2] ? parseInt(t[2],10) : 0];
  } else if (cut(/\bnoon\b/i)) time = [12,0];
  else if (cut(/\bmidnight\b/i)) time = [23,59];
  else if ((t = cut(/\bat\s+(\d{1,2}):(\d{2})\b/))) time = [parseInt(t[1],10), parseInt(t[2],10)];

  /* date */
  let date = null;
  if (cut(/\b(today|tonight)\b/i)) date = startOfDay(new Date());
  else if (cut(/\b(tomorrow|tmrw?|tmr)\b/i)){ date = startOfDay(new Date()); date.setDate(date.getDate()+1); }
  else if ((m = cut(/\bin\s+(\d+)\s*(day|days|week|weeks)\b/i))){
    date = startOfDay(new Date());
    date.setDate(date.getDate() + parseInt(m[1],10) * (/week/i.test(m[2]) ? 7 : 1));
  }
  else if ((m = cut(new RegExp("\\b(next\\s+)?(" + WEEKDAYS.join("|") + "|" + WD_SHORT.join("|") + ")\\b","i")))){
    const w = m[2].toLowerCase();
    let idx = WEEKDAYS.indexOf(w);
    if (idx < 0) idx = WD_SHORT.findIndex(x => w.startsWith(x));
    date = nextWeekday(idx, !!m[1]);
  }
  else if (cut(/\bnext week\b/i)){ date = startOfDay(new Date()); date.setDate(date.getDate()+7); }
  else if ((m = cut(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){
    const y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : new Date().getFullYear();
    date = new Date(y, +m[1]-1, +m[2]);
    if (!m[3] && date < startOfDay(new Date())) date.setFullYear(y+1);
  }
  else if ((m = cut(new RegExp("\\b(" + MON3 + ")[a-z]*\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b","i")))){
    const mi = MONTHS.findIndex(x => x.startsWith(m[1].toLowerCase()));
    const y = new Date().getFullYear();
    date = new Date(y, mi, +m[2]);
    if (date < startOfDay(new Date())) date.setFullYear(y+1);
  }
  else if ((m = cut(new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?(" + MON3 + ")[a-z]*\\b","i")))){
    const mi = MONTHS.findIndex(x => x.startsWith(m[2].toLowerCase()));
    const y = new Date().getFullYear();
    date = new Date(y, mi, +m[1]);
    if (date < startOfDay(new Date())) date.setFullYear(y+1);
  }

  if (date){
    date.setHours(time ? time[0] : 23, time ? time[1] : 59, 0, 0);
    res.due = date.toISOString();
  }

  /* class by name, code, or nickname */
  if (!res.newClass){
    const hit = matchClass(s);
    if (hit){
      res.classId = hit.id;
      s = s.replace(new RegExp("\\bfor\\s+" + esc(hit.word) + "\\b","i"), " ")
           .replace(new RegExp("\\b" + esc(hit.word) + "\\b","i"), " ");
    }
  }

  res.title = s.replace(/\s+/g," ")
               .replace(/\b(due|by|on|for|at|this|in)\b\s*$/gi,"")
               .replace(/\s*\b(due|by)\b\s*$/gi,"")
               .replace(/^[\s,:;\-–—]+|[\s,:;\-–—]+$/g,"")
               .trim();
  res.title = res.title.charAt(0).toUpperCase() + res.title.slice(1);
  return res;
}

function aliasMap(){
  const counts = {}, list = [];
  for (const c of state.classes){
    const words = new Set();
    words.add(c.name.toLowerCase());
    if (c.code){
      words.add(c.code.toLowerCase());
      words.add(c.code.replace(/\s+/g,"").toLowerCase());
      const num = c.code.match(/\d{3,4}/);
      if (num) words.add(num[0]);
    }
    (c.alias || []).forEach(a => a.trim() && words.add(a.trim().toLowerCase()));
    if (!(c.alias || []).length && !c.code){
      const fw = c.name.split(/\s+/)[0];
      if (fw.length >= 4) words.add(fw.toLowerCase());
    }
    words.forEach(w => { counts[w] = (counts[w] || 0) + 1; list.push({id:c.id, word:w}); });
  }
  return list.filter(x => counts[x.word] === 1);   // drop anything two classes both claim
}

function matchClass(hay){
  const h = " " + String(hay).toLowerCase() + " ";
  let best = null;
  for (const a of aliasMap()){
    if (a.word.length < 3) continue;
    if (new RegExp("\\b" + esc(a.word) + "\\b").test(h)){
      if (!best || a.word.length > best.word.length) best = a;
    }
  }
  return best;
}

/* ---------------- mutations ---------------- */
const uid = () => Math.random().toString(36).slice(2,10);

function addFromText(text, defaultClassId){
  const p = parse(text, defaultClassId);
  if (!p.title) return null;
  let classId = p.classId;
  if (p.newClass) classId = ensureClass(p.newClass).id;
  const item = {id:uid(), title:p.title, classId, due:p.due, done:false, created:Date.now()};
  state.items.push(item);
  return item;
}
function ensureClass(name){
  const found = state.classes.find(c => c.name.toLowerCase() === name.toLowerCase());
  if (found) return found;
  const c = {id:uid(), code:"", name, color:PALETTE[state.classes.length % PALETTE.length],
             instructor:"", alias:[], meets:[], syllabus:null, syllabusUrl:"", notes:""};
  state.classes.push(c);
  return c;
}
const classOf = id => state.classes.find(c => c.id === id) || null;
const colorOf = id => (classOf(id) || {}).color || "#8E8E93";
const nameOf  = id => (classOf(id) || {}).name  || "Unfiled";

/* Friendly short display name — never the course code. Uses shortName if set,
   otherwise the first alias typed in, otherwise a trimmed version of the full name. */
function shortName(c){
  if (!c) return "Unfiled";
  if (c.shortLabel) return c.shortLabel;
  const n = c.name.split(/\s+/);
  return n.length > 2 ? n.slice(0,2).join(" ") : c.name;
}

function buckets(items){
  const now = new Date();
  const g = {overdue:[], today:[], tomorrow:[], week:[], later:[], undated:[]};
  for (const it of items){
    if (!it.due){ g.undated.push(it); continue; }
    const d = new Date(it.due), diff = daysBetween(now, d);
    if (d < now) g.overdue.push(it);
    else if (diff === 0) g.today.push(it);
    else if (diff === 1) g.tomorrow.push(it);
    else if (diff <= 7) g.week.push(it);
    else g.later.push(it);
  }
  const by = (a,b) => new Date(a.due) - new Date(b.due);
  ["overdue","today","tomorrow","week","later"].forEach(k => g[k].sort(by));
  return g;
}

/* ---------------- dom helpers ---------------- */
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const escHtml = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hexa = (hex,a) => { const n = parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
const kb = n => n < 1024*1024 ? Math.max(1, Math.round(n/1024)) + " KB" : (n/1048576).toFixed(1) + " MB";

/* ---------------- render ---------------- */
function render(){
  const now = new Date();
  $("today-label").textContent = now.toLocaleDateString([], {weekday:"long", month:"long", day:"numeric"});
  const h = now.getHours();
  $("greeting").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";

  renderTabs();
  const view = $("view");
  view.innerHTML = "";

  $("preview").style.display = onIntern ? "none" : "flex";
  $("footer-course-actions").style.display = onIntern ? "none" : "inline";
  $("footer-intern-actions").style.display = onIntern ? "inline" : "none";

  if (onIntern) renderInternships(view);
  else if (state.tab === "all") renderOverall(view);
  else renderClass(view, state.tab);

  if (onIntern){
    const openN = state.internships.filter(x => !CLOSED.includes(x.status)).length;
    $("count-note").textContent = openN === 0 ? "No active applications" : openN + (openN === 1 ? " application active" : " applications active");
  } else {
    const open = state.items.filter(i => !i.done).length;
    $("count-note").textContent = open === 0 ? "All clear" : open + (open === 1 ? " assignment open" : " assignments open");
  }
  $("toggle-done").textContent = state.showDone ? "Hide completed" : "Show completed";
  $("toggle-closed").textContent = state.showClosed ? "Hide closed" : "Show closed";
}

function renderTabs(){
  const bar = $("tabs");
  bar.innerHTML = "";
  const mk = (label, id, color, count) => {
    const b = el("button","tab" + (state.tab === id ? " on" : ""));
    if (color){ const d = el("span","dot"); d.style.background = color; b.appendChild(d); }
    b.appendChild(document.createTextNode(label));
    if (count) b.appendChild(el("span","n", String(count)));
    if (state.tab === id) b.style.background = hexa(color, .22);
    b.onclick = () => { state.tab = id; state.editing = null; render(); window.scrollTo({top:0, behavior:"smooth"}); };
    bar.appendChild(b);
  };
  mk("All","all","#0A84FF", state.items.filter(i=>!i.done).length);
  for (const c of state.classes){
    mk(shortName(c), c.id, c.color, state.items.filter(i => i.classId === c.id && !i.done).length);
  }
  const add = el("button","tab ghost","+ Class");
  add.onclick = () => openClassSheet();
  bar.appendChild(add);
  const div = el("span"); div.style.cssText = "width:1px;flex:none;align-self:stretch;background:var(--hairline);margin:4px 2px";
  bar.appendChild(div);
  mk("Internships","internships","#FF9F0A", state.internships.filter(x => !CLOSED.includes(x.status)).length);
}

function ring(pct, color, big, sub){
  const R = 52, C = 2*Math.PI*R;
  const w = el("div","ring-wrap");
  w.innerHTML = `<svg width="100%" height="100%" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="${hexa(color,.18)}" stroke-width="12"/>
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"
        style="transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)"/>
    </svg>
    <div class="ring-center"><div class="big">${big}</div><div class="sub">${sub}</div></div>`;
  return w;
}

function renderOverall(view){
  const open = state.items.filter(i => !i.done);
  const g = buckets(open);
  const now = new Date();
  const weekItems = state.items.filter(i => i.due && Math.abs(daysBetween(now, new Date(i.due))) <= 7);
  const weekDone = weekItems.filter(i => i.done).length;
  const pct = weekItems.length ? weekDone / weekItems.length : 0;

  const card = el("div","card");
  card.appendChild(el("div","card-title","<span>This week</span>"));
  const sum = el("div","summary");
  sum.appendChild(ring(pct, "#30D158", Math.round(pct*100) + "%", weekDone + " of " + weekItems.length));
  const stats = el("div","stats");
  const stat = (n,l,c) => { const s = el("div","stat"); s.innerHTML = `<div class="n" style="color:${c}">${n}</div><div class="l">${l}</div>`; return s; };
  stats.appendChild(stat(g.overdue.length, "Overdue", g.overdue.length ? "#FF453A" : "#F5F5F7"));
  stats.appendChild(stat(g.today.length, "Due today", g.today.length ? "#FF9F0A" : "#F5F5F7"));
  stats.appendChild(stat(g.today.length + g.tomorrow.length + g.week.length, "Next 7 days", "#0A84FF"));
  sum.appendChild(stats);
  card.appendChild(sum);
  view.appendChild(card);

  /* today's classes */
  const dow = now.getDay();
  const meetings = [];
  state.classes.forEach(c => (c.meets || []).forEach(m => {
    if (m.days.includes(dow)) meetings.push({c, m});
  }));
  meetings.sort((a,b) => minutesOf(a.m.start) - minutesOf(b.m.start));
  const sc = el("div","card");
  sc.appendChild(el("div","card-title","<span>Today's classes</span>"));
  if (!meetings.length){
    sc.appendChild(el("div","empty",`<div class="p">No classes today.</div>`));
  } else {
    const mins = now.getHours()*60 + now.getMinutes();
    meetings.forEach(({c,m}) => {
      const r = el("div","sched" + (minutesOf(m.end) < mins ? " past" : ""));
      r.innerHTML = `<span class="dot" style="background:${c.color}"></span>
        <span class="tm">${fmtClock(m.start)}</span>
        <span class="nm">${escHtml(c.name)}</span>
        <span class="rm">${escHtml(m.room || "")}</span>`;
      r.style.cursor = "pointer";
      r.onclick = () => { state.tab = c.id; render(); };
      sc.appendChild(r);
    });
  }
  view.appendChild(sc);

  /* workload chart */
  const wk = el("div","card");
  wk.appendChild(el("div","card-title","<span>Workload ahead</span>"));
  const week = el("div","week");
  const counts = Array.from({length:7}, (_,k) => {
    const d = new Date(); d.setDate(d.getDate()+k);
    return open.filter(i => i.due && sameDay(new Date(i.due), d));
  });
  const max = Math.max(1, ...counts.map(c => c.length));
  counts.forEach((list, k) => {
    const d = new Date(); d.setDate(d.getDate()+k);
    const col = el("div","day" + (k === 0 ? " now" : ""));
    const bars = el("div","bars");
    if (list.length){
      list.forEach(i => {
        const b = el("div","bar");
        b.style.background = colorOf(i.classId);
        b.style.height = Math.max(6, (78 / max) - 2) + "px";
        b.title = i.title + " — " + nameOf(i.classId);
        bars.appendChild(b);
      });
    } else bars.appendChild(el("div","empty-tick"));
    col.appendChild(bars);
    col.appendChild(el("div","lbl", k === 0 ? "Today" : d.toLocaleDateString([], {weekday:"short"})));
    week.appendChild(col);
  });
  wk.appendChild(week);
  view.appendChild(wk);

  /* by class */
  const active = state.classes.filter(c => state.items.some(i => i.classId === c.id));
  if (active.length){
    const bc = el("div","card");
    bc.appendChild(el("div","card-title","<span>By class</span>"));
    active.forEach(c => {
      const mine = state.items.filter(i => i.classId === c.id);
      const done = mine.filter(i => i.done).length;
      const row = el("div","brk");
      row.innerHTML = `<span class="dot" style="background:${c.color}"></span>
        <span class="nm">${escHtml(c.name)}</span>
        <span class="track"><i style="width:${Math.round(done/mine.length*100)}%;background:${c.color}"></i></span>
        <span class="ct">${mine.length - done} open</span>`;
      row.style.cursor = "pointer";
      row.onclick = () => { state.tab = c.id; render(); };
      bc.appendChild(row);
    });
    view.appendChild(bc);
  }

  if (!state.items.length){
    view.appendChild(emptyState("No assignments yet",
      "Type one above, or use Import syllabus to paste a whole schedule at once."));
    return;
  }
  renderGroups(view, g);
  renderDone(view, state.items.filter(i => i.done));
}

function renderClass(view, id){
  const c = classOf(id);
  if (!c){ state.tab = "all"; render(); return; }
  const mine = state.items.filter(i => i.classId === id);
  const open = mine.filter(i => !i.done), done = mine.filter(i => i.done);

  /* course header */

  ["M","T","W","R","F"].forEach(d => {

  });
  hd.appendChild(who);
  hd.appendChild(ring(pct, c.color, done.length + "/" + mine.length, "Done"));
  head.appendChild(hd);
  const acts = el("div","acts");
  const ed = el("button","btn sm","Edit class"); ed.onclick = () => openClassSheet(c);
  const dp = el("button","btn sm pri","Import syllabus"); dp.onclick = () => openDumpSheet(c.id);
  acts.append(dp, ed);
  head.appendChild(acts);

  view.appendChild(syllabusCard(c));

  const g = buckets(open);
  if (!mine.length){

      "Anything you type mentioning “" + (c.alias && c.alias[0] ? c.alias[0] : c.name) + "” lands here automatically."));
    return;
  }
  const stats = el("div","card");
  stats.appendChild(el("div","card-title","<span>Status</span>"));

  const stat = (n,l,col) => { const s = el("div","stat"); s.innerHTML = `<div class="n" style="color:${col}">${n}</div><div class="l">${l}</div>`; return s; };
  sr.appendChild(stat(g.overdue.length, "Overdue", g.overdue.length ? "#FF453A" : "#F5F5F7"));
  sr.appendChild(stat(open.length, "Open", c.color));
  sr.appendChild(stat(done.length, "Completed", "#30D158"));
  stats.appendChild(sr);
  view.appendChild(stats);

  renderGroups(view, g);
  renderDone(view, done);
}

/* ---------------- internships ---------------- */
function renderInternships(view){
  const all = state.internships;
  const open = all.filter(x => !CLOSED.includes(x.status));

  const head = el("div","card");
  const ht = el("div","card-title","<span>Internship pipeline</span>");
  const addBtn = el("button","btn sm pri","+ Add company");
  addBtn.onclick = () => openInternSheet();
  ht.appendChild(addBtn);
  head.appendChild(ht);

  if (all.length){
    const sum = el("div","stats");
    const stat = (n,l,col) => { const s = el("div","stat"); s.innerHTML = `<div class="n" style="color:${col}">${n}</div><div class="l">${l}</div>`; return s; };
    const applied = all.filter(x => x.status === "Applied").length;
    const interviewing = all.filter(x => x.status === "Interviewing" || x.status === "OA / Assessment").length;
    const offers = all.filter(x => x.status === "Offer").length;
    sum.appendChild(stat(open.length, "Active", "#FF9F0A"));
    sum.appendChild(stat(applied, "Applied", "#0A84FF"));
    sum.appendChild(stat(interviewing, "Interviewing", "#FFD60A"));
    sum.appendChild(stat(offers, "Offers", "#30D158"));
    head.appendChild(sum);
  }
  view.appendChild(head);

  if (!all.length){
    view.appendChild(emptyState("No companies tracked yet",
      "Add a company you've reached out to — track its status as you move from applied to interviewing to offer."));
    return;
  }

  /* group by pipeline stage */
  const stageOrder = state.showClosed ? STATUSES : STATUSES.filter(s => !CLOSED.includes(s));
  let any = false;
  stageOrder.forEach(status => {
    const list = all.filter(x => x.status === status).sort((a,b) => (b.updated||0) - (a.updated||0));
    if (!list.length) return;
    any = true;
    view.appendChild(el("div","group-h" + (status === "Rejected" ? " alert" : ""), status + " · " + list.length));
    list.forEach(x => view.appendChild(internRow(x)));
  });
  if (!any) view.appendChild(emptyState("Nothing active", "Everything you've tracked is closed out. Show closed to see it."));
}

/* ---------------- syllabus card ---------------- */
function syllabusCard(c){
  const card = el("div","card");
  const t = el("div","card-title","<span>Syllabus</span>");
  card.appendChild(t);
  const stack = el("div","stack");

  if (c.syllabus){
    const f = el("div","syl-file");
    f.innerHTML = `<span class="dot" style="background:${c.color}"></span>
      <span class="fi"><span class="fn">${escHtml(c.syllabus.name)}</span>
      <span class="fs">${kb(c.syllabus.size)} · saved in this browser</span></span>`;
    const open = el("button","btn sm pri","Open");
    open.onclick = async () => {
      try {
        const blob = await Files.get(c.syllabus.key);
        if (!blob) return toast("That file is missing — attach it again.");
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank");
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch(e){ toast("Couldn't open the file."); }
    };
    const rm = el("button","btn sm danger","Remove");
    rm.onclick = async () => {
      try { await Files.del(c.syllabus.key); } catch(e){}
      c.syllabus = null; save(); render(); toast("Syllabus removed");
    };
    f.append(open, rm);
    stack.appendChild(f);
  } else {
    const drop = el("div","drop",
      `<div class="h">Add the syllabus</div><div class="p">Drop a PDF here, or click to choose a file</div>`);
    const picker = el("input"); picker.type = "file"; picker.style.display = "none";
    picker.accept = ".pdf,.docx,.doc,.txt,.md,.png,.jpg,.jpeg,.rtf";
    picker.onchange = () => picker.files[0] && attach(c, picker.files[0]);
    drop.onclick = () => picker.click();
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => {
      e.preventDefault(); drop.classList.remove("over");
      const file = e.dataTransfer.files[0];
      if (file) attach(c, file);
    };
    stack.append(drop, picker);
  }

  const linkRow = el("div","row-2");
  const link = el("input","field grow");
  link.placeholder = "Canvas or Drive link to the syllabus";
  link.value = c.syllabusUrl || "";
  link.onchange = () => { c.syllabusUrl = link.value.trim(); save(); render(); };
  linkRow.appendChild(link);
  if (c.syllabusUrl){
    const go = el("button","btn","Open link");
    go.onclick = () => window.open(c.syllabusUrl, "_blank", "noopener");
    linkRow.appendChild(go);
  }
  stack.appendChild(linkRow);

  const notes = el("textarea","field");
  notes.placeholder = "Grading breakdown, late policy, office hours, exam dates — anything worth keeping one click away.";
  notes.value = c.notes || "";
  notes.onchange = () => { c.notes = notes.value; save(); toast("Notes saved"); };
  stack.appendChild(notes);

  card.appendChild(stack);
  return card;
}

async function attach(c, file){
  if (file.size > 25*1024*1024) return toast("That file is over 25 MB — link to it instead.");
  const key = "syl_" + c.id;
  try {
    await Files.put(key, file);
    c.syllabus = {key, name:file.name, size:file.size, type:file.type};
    save(); render(); toast("Syllabus saved");
  } catch(e){
    toast("This browser won't store files here — use the link field.");
  }
}

/* ---------------- lists ---------------- */
function renderGroups(view, g){
  const order = [["overdue","Overdue",true],["today","Today",false],["tomorrow","Tomorrow",false],
                 ["week","This week",false],["later","Later",false],["undated","No due date",false]];
  let any = false;
  for (const [k,label,alert] of order){
    if (!g[k].length) continue;
    any = true;
    view.appendChild(el("div","group-h" + (alert ? " alert" : ""), label + " · " + g[k].length));
    g[k].forEach(it => view.appendChild(rowFor(it)));
  }
  if (!any) view.appendChild(emptyState("Nothing open", "Everything here is done."));
}

function renderDone(view, done){
  if (!done.length || !state.showDone) return;
  view.appendChild(el("div","group-h","Completed · " + done.length));
  done.slice().sort((a,b) => (b.completedAt||0) - (a.completedAt||0)).forEach(it => view.appendChild(rowFor(it)));
}

function rowFor(it){
  if (state.editing === it.id) return editorFor(it);
  const row = el("div","row" + (it.done ? " done" : ""));
  const tick = el("button","tick");
  tick.setAttribute("aria-label", it.done ? "Mark not done" : "Mark done");
  if (it.done){ tick.style.borderColor = colorOf(it.classId); tick.style.background = colorOf(it.classId); }
  tick.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.2 4.6 8.8 10 3.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  tick.onclick = () => { it.done = !it.done; it.completedAt = it.done ? Date.now() : null; save(); render(); };

  const body = el("div","body");
  body.appendChild(el("div","t", escHtml(it.title)));
  const meta = el("div","m");
  const dot = el("span","dot"); dot.style.background = colorOf(it.classId);
  meta.append(dot, el("span","cls", escHtml(state.tab === "all" ? nameOf(it.classId) : shortName(classOf(it.classId)))));
  if (it.due){
    meta.appendChild(el("span","sep","·"));
    meta.appendChild(el("span","when " + lateness(it.due), fmtDue(it.due)));
  }
  body.appendChild(meta);

  const edit = el("button","icon-btn",
    `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M11.3 2.7a1.7 1.7 0 0 1 2.4 2.4l-7.4 7.4-3.2.8.8-3.2 7.4-7.4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`);
  edit.setAttribute("aria-label","Edit assignment");
  edit.onclick = () => { state.editing = it.id; render(); };

  row.append(tick, body, edit);
  return row;
}

function editorFor(it){
  const box = el("div","row");
  box.style.flexDirection = "column"; box.style.alignItems = "stretch"; box.style.gap = "0";
  const fields = el("div","fields");
  const title = el("input","field grow"); title.value = it.title;
  const sel = el("select","field");
  sel.innerHTML = `<option value="">Unfiled</option>` +
    state.classes.map(c => `<option value="${c.id}"${c.id===it.classId?" selected":""}>${escHtml(shortName(c))}</option>`).join("");
  const date = el("input","field"); date.type = "datetime-local";
  if (it.due){ const d = new Date(it.due); date.value = new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,16); }
  fields.append(title, sel, date);

  const acts = el("div","acts");
  const ok = el("button","btn pri","Save");
  ok.onclick = () => {
    it.title = title.value.trim() || it.title;
    it.classId = sel.value || null;
    it.due = date.value ? new Date(date.value).toISOString() : null;
    state.editing = null; save(); render();
  };
  const cancel = el("button","btn","Cancel");
  cancel.onclick = () => { state.editing = null; render(); };
  const del = el("button","btn danger","Delete");
  del.onclick = () => {
    state.items = state.items.filter(x => x.id !== it.id);
    state.editing = null; save(); render(); toast("Assignment deleted");
  };
  acts.append(ok, cancel, del);
  box.append(fields, acts);
  setTimeout(() => title.focus(), 0);
  return box;
}

  const addAll = el("button","btn pri","Add assignments");
  addAll.disabled = true;
  const cancel = el("button","btn","Cancel"); cancel.onclick = close;
  const note = el("span"); note.style.cssText = "font-size:12.5px;color:var(--text-3);margin-left:auto";
  foot.append(addAll, cancel, note);
  sheet.appendChild(foot);

  let rows = [];
  const preview = () => {
    const lines = ta.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    rows = lines.map(line => ({line, p:parse(line, sel.value || null), on:true}))
                .filter(r => r.p.title);
    listBox.innerHTML = "";
    if (!rows.length){
      listBox.appendChild(el("div","empty",`<div class="p">Nothing to import yet — paste some lines and hit Preview.</div>`));
      addAll.disabled = true; note.textContent = ""; return;
    }
    rows.forEach((r, i) => {
      const d = el("div","dl");
      const cb = el("input"); cb.type = "checkbox"; cb.checked = true;
      cb.onchange = () => { r.on = cb.checked; d.classList.toggle("off", !cb.checked); count(); };
      const b = el("div","b");
      b.appendChild(el("div","t", escHtml(r.p.title)));
      const m = el("div","m");
      const cid = r.p.classId;
      const cls = el("span","chip", escHtml(cid ? shortName(classOf(cid)) : "Unfiled"));
      const dt = el("span","dot"); dt.style.background = cid ? colorOf(cid) : "#636368";
      cls.prepend(dt);
      m.appendChild(cls);
      m.appendChild(r.p.due ? el("span","chip", fmtDue(r.p.due)) : el("span","chip warn","No date found"));
      b.appendChild(m);
      d.append(cb, b);
      listBox.appendChild(d);
    });
    count();
  };
  const count = () => {
    const n = rows.filter(r => r.on).length;
    addAll.disabled = !n;
    addAll.textContent = n ? "Add " + n + (n === 1 ? " assignment" : " assignments") : "Add assignments";
    note.textContent = rows.filter(r => r.on && !r.p.due).length ?
      rows.filter(r => r.on && !r.p.due).length + " without a date" : "";
  };

  parseBtn.onclick = preview;
  sel.onchange = () => { if (rows.length) preview(); };
  ta.addEventListener("paste", () => setTimeout(preview, 0));

  addAll.onclick = () => {
    let n = 0;
    rows.filter(r => r.on).forEach(r => { if (addFromText(r.line, sel.value || null)) n++; });
    save(); close(); render(); toast("Added " + n + (n === 1 ? " assignment" : " assignments"));
  };
  setTimeout(() => ta.focus(), 0);
}

function makeSheet(wide){
  const scrim = el("div","scrim");
  const sheet = el("div","sheet" + (wide ? " wide" : ""));
  scrim.appendChild(sheet);
  scrim.onclick = e => { if (e.target === scrim) close(); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  function close(){ scrim.remove(); document.removeEventListener("keydown", onKey); }
  document.body.appendChild(scrim);
  return {scrim, sheet, close};
}

/* ---------------- settings / sync sheet ---------------- */
function genCode(){
  const words = ["orbit","cedar","photon","maple","quartz","raven","delta","ember","glacier","harbor"];
  const w = words[Math.floor(Math.random()*words.length)];
  return w + "-" + Math.floor(1000 + Math.random()*9000);
}

function openSettingsSheet(){
  const {sheet, close} = makeSheet(true);

  if (!cloud){
    sheet.innerHTML = `<h2>Sync across devices</h2>
      <p class="lede">Connect a free Supabase project once, then use the same sync code on your phone and computer to keep them in sync. Your data stays in your own project — nobody else can read it without the code.</p>`;
    const stack = el("div","stack");
    const url = el("input","field"); url.placeholder = "Supabase Project URL — https://xxxx.supabase.co";
    const key = el("input","field"); key.placeholder = "Supabase anon public key";
    const code = el("input","field"); code.placeholder = "Sync code — leave blank to generate one";
    [url,key,code].forEach(f => { f.style.width = "100%"; stack.appendChild(f); });
    sheet.appendChild(stack);

    const help = el("div","steps");
    help.style.marginTop = "14px";
    help.innerHTML = `<b>First time?</b> Create a free project at
      <a href="https://supabase.com" target="_blank" rel="noopener">supabase.com</a>, then in the SQL editor run the setup script
      (ask Claude to show it again any time) to create the table. Grab the Project URL and anon key from
      Project Settings → API.`;
    sheet.appendChild(help);

    const acts = el("div","acts");
    const ok = el("button","btn pri","Connect");
    ok.onclick = async () => {
      const u = url.value.trim(), k = key.value.trim();
      if (!u || !k){ toast("Add your Supabase URL and anon key first"); return; }
      const c = code.value.trim() || genCode();
      ok.textContent = "Connecting…"; ok.disabled = true;
      saveCloudConfig({url:u, anonKey:k, code:c});
      try {
        await cloudPush({classes:state.classes, items:state.items, internships:state.internships,
                          showDone:state.showDone, showClosed:state.showClosed});
        setSyncBadge("synced"); startCloudPolling();
        close(); toast("Synced — your code is " + c);
        openSettingsSheet();
      } catch(e){
        clearCloudConfig(); setSyncBadge("");
        toast("Couldn't connect — check the URL, key, and that the table exists");
        ok.textContent = "Connect"; ok.disabled = false;
      }
    };
    const cancel = el("button","btn","Cancel"); cancel.onclick = close;
    acts.append(ok, cancel);
    sheet.appendChild(acts);
    setTimeout(() => url.focus(), 0);
    return;
  }

  /* already connected: show code + pairing + disconnect */
  sheet.innerHTML = `<h2>Synced</h2>
    <p class="lede">Enter this same code in Settings on your other device to keep them matched up.</p>`;
  const codeBox = el("div","code-display", escHtml(cloud.code));
  sheet.appendChild(codeBox);

  const copyBtn = el("button","btn","Copy code");
  copyBtn.onclick = async () => {
    try { await navigator.clipboard.writeText(cloud.code); toast("Code copied"); }
    catch(e){ toast("Couldn't copy — select the code manually"); }
  };
  sheet.appendChild(copyBtn);

  const row = el("div","sync-row"); row.style.marginTop = "16px";
  row.innerHTML = `<span class="sync-dot" style="background:${cloud ? '#30D158' : '#636368'}"></span>
    <span style="font-size:13.5px;color:var(--text-2)">Project: ${escHtml(cloud.url.replace(/^https?:\/\//,""))}</span>`;
  sheet.appendChild(row);

  const acts = el("div","acts");
  const done = el("button","btn pri","Done"); done.onclick = close;
  const disconnect = el("button","btn danger","Disconnect this device");
  disconnect.onclick = () => {
    if (!confirm("Stop syncing this device? Your data stays on this device and in the cloud — this only stops the connection here.")) return;
    clearCloudConfig(); setSyncBadge(""); close(); toast("Disconnected");
  };
  acts.append(done, disconnect);
  sheet.appendChild(acts);
}


let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2400);
}

/* ---------------- composer ---------------- */
const input = $("quick-add"), addBtn = $("add-btn"), preview = $("preview");

function updatePreview(){
  const v = input.value.trim();
  addBtn.disabled = !v;
  if (!v){
    preview.textContent = "Type an assignment — the class and due date get pulled out automatically.";
    return;
  }
  const p = parse(v, state.tab === "all" ? null : state.tab);
  preview.innerHTML = "";
  const chip = (html, dotColor, cls) => {
    const c = el("span","chip" + (cls ? " " + cls : ""), html);
    if (dotColor){ const d = el("span","dot"); d.style.background = dotColor; c.prepend(d); }
    preview.appendChild(c);
  };
  chip("<b>" + escHtml(p.title || "…") + "</b>");
  if (p.classId) chip(escHtml(shortName(classOf(p.classId))), colorOf(p.classId));
  else if (p.newClass) chip("New class · <b>" + escHtml(p.newClass) + "</b>", "#8E8E93");
  else chip("Unfiled", "#636368");
  if (p.due) chip("Due <b>" + fmtDue(p.due) + "</b>");
  else chip("No due date", null, "warn");
}

function submit(){
  const v = input.value.trim();
  if (!v) return;
  const item = addFromText(v, state.tab === "all" ? null : state.tab);
  if (!item) return;
  save();
  input.value = "";
  updatePreview();
  render();
  toast("Added to " + nameOf(item.classId));
}

input.addEventListener("input", updatePreview);
input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
addBtn.addEventListener("click", submit);
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== input && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); input.focus();
  }
});

$("import").onclick = () => openDumpSheet(state.tab === "all" ? null : state.tab);
$("settings-btn").onclick = openSettingsSheet;
$("toggle-done").onclick = () => { state.showDone = !state.showDone; save(); render(); };
$("toggle-closed").onclick = () => { state.showClosed = !state.showClosed; save(); render(); };
$("wipe").onclick = () => {
  const msg = state.tab === "internships"
    ? "Delete every company you're tracking? This can't be undone."
    : "Delete every assignment and reset your classes to the roster? Syllabus files are removed too.";
  if (!confirm(msg)) return;
  if (state.tab === "internships"){
    state.internships = []; save(); render(); return;
  }
  state.classes.forEach(c => { if (c.syllabus) Files.del(c.syllabus.key).catch(()=>{}); });
  state.items = []; state.classes = []; seed(); state.tab = "all"; save(); render();
};

/* ---------------- automation hooks (Claude in Chrome) ---------------- */
window.tracker = {
  add(text, className){
    const c = className ? matchClass(className) : null;
    const i = addFromText(text, c ? c.id : null);
    save(); render();
    if (i) toast("Added to " + nameOf(i.classId));
    return i;
  },
  addMany(lines, className){
    const c = className ? matchClass(className) : null;
    let n = 0;
    lines.forEach(t => { if (addFromText(t, c ? c.id : null)) n++; });
    save(); render(); toast("Added " + n + " assignments");
    return n;
  },
  dump(text, className){ return this.addMany(String(text).split(/\r?\n/).filter(l => l.trim()), className); },
  list(){ return state.items.map(i => ({title:i.title, class:nameOf(i.classId), due:i.due, done:i.done})); },
  classes(){ return state.classes.map(c => ({name:c.name, shortName:shortName(c), instructor:c.instructor})); },
  addCompany(company, opts){
    opts = opts || {};
    const x = {
      id: uid(), company, role: opts.role || "", status: opts.status || "Applied",
      link: opts.link || "", contactedOn: opts.contactedOn ? new Date(opts.contactedOn).toISOString() : new Date().toISOString(),
      notes: opts.notes || "", updated: Date.now()
    };
    state.internships.push(x); save(); render(); toast("Added " + company);
    return x;
  },
  setStatus(company, status){
    const x = state.internships.find(x => x.company.toLowerCase() === String(company).toLowerCase());
    if (!x || !STATUSES.includes(status)) return null;
    x.status = status; x.updated = Date.now(); save(); render();
    return x;
  },
  internships(){ return state.internships.map(x => ({company:x.company, role:x.role, status:x.status, contactedOn:x.contactedOn, notes:x.notes})); }
};

/* ---------------- boot ---------------- */
function seed(){
  SEED.forEach(s => state.classes.push(Object.assign({
    id:uid(), syllabus:null, syllabusUrl:"", notes:""
  }, s)));
}

$("tabs").addEventListener("wheel", e => {
  if (e.deltaY === 0) return;
  e.preventDefault();
  $("tabs").scrollLeft += e.deltaY;
}, {passive:false});

/* ---------------- PWA install support ---------------- */
function registerServiceWorker(){
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

(async function boot(){
  loadCloudConfig();
  const saved = await Store.load();
  if (saved && saved.classes && saved.classes.length){
    state.classes = saved.classes;
    state.items = saved.items || [];
    state.internships = saved.internships || [];
    state.showDone = !!saved.showDone;
    state.showClosed = !!saved.showClosed;
  } else {
    seed();
    await save();
  }
  const params = new URLSearchParams(location.search);
  const q = params.get("add");
  if (q){
    const c = params.get("class") ? matchClass(params.get("class")) : null;
    q.split(/\s*;\s*|\n/).filter(Boolean).forEach(t => addFromText(t, c ? c.id : null));
    await save();
    history.replaceState({}, "", location.pathname);
  }
  render();
  updatePreview();
  setSyncBadge(cloud ? "synced" : "");
  if (cloud) startCloudPolling();
  registerServiceWorker();
})();

</script>
